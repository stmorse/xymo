<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Xymo</title>

    <link rel='stylesheet' href='style.css'>
    <script src='data.js' type='text/javascript'></script>
    <script src='engine.js' type='text/javascript'></script>
    <script src='ui.js' type='text/javascript'></script>

</head>
<body>

    <div id="container">
        <div id="terminal">
            <div id="statusline"></div>
            <div id="scroll"></div>
            <div id="inputline">
                <span id="prompt">&gt;&nbsp;</span>
                <div id="inputwrap">
                    <div id="mirror"></div>
                    <textarea id="cmd" rows="1" autocomplete="off"
                              autocorrect="off" autocapitalize="off"
                              spellcheck="false"></textarea>
                </div>
            </div>
        </div>
        <div id="footer">Xymo | Created by <a href='https://github.com/stmorse'>S. Morse</a> | 2023</div>
    </div>

</body></html>
